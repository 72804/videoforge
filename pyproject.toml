[project]
name = "docprod"
version = "0.1.0"
description = "Local-first AI-assisted documentary video production pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "rich>=13",
    "openai>=3.16.0",
    "pillow>=12.3.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.scripts]
docprod = "docprod.cli:app"

[project.optional-dependencies]
google = ["google-genai>=2.24.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docprod"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "google-genai>=2.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
