services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docprod
      POSTGRES_PASSWORD: docprod
      POSTGRES_DB: docprod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docprod -d docprod"]
      interval: 2s
      timeout: 5s
      retries: 20
